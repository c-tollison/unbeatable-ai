<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Unbeatable AI</title>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=Lato&family=Nanum+Gothic&family=Oswald&family=Poppins&family=Raleway&display=swap");
        </style>

        <link rel="stylesheet" href="styles/style.css" />
        <script src="script.js" defer></script>
    </head>

    <body>
        <div class="container">
            <div class="top">
                <div class="top-button game-controls hidden">
                    <button class="back" type="button">Back</button>
                    <button class="reset" type="button">Reset</button>
                </div>
                <div class="headers">
                    <h1>Tic Tac Toe</h1>
                    <h3 class="winner-msg"></h3>
                    <p class="turn-msg" aria-live="polite"></p>
                </div>
            </div>
            <div class="bottom">
                <div class="start-options">
                    <label for="player-name-input" class="visually-hidden"
                        >Player name</label
                    >
                    <input
                        type="text"
                        class="player-inputs"
                        placeholder="Enter Player Name"
                        id="player-name-input"
                    />
                    <div
                        class="symbol-div"
                        role="group"
                        aria-label="Choose your symbol"
                    >
                        <button
                            class="player-symbol chosen"
                            id="X"
                            type="button"
                            aria-pressed="true"
                        >
                            X
                        </button>
                        <button
                            class="player-symbol"
                            id="O"
                            type="button"
                            aria-pressed="false"
                        >
                            O
                        </button>
                    </div>
                    <label for="difficulty" class="visually-hidden"
                        >Difficulty</label
                    >
                    <select
                        name="Difficulty"
                        id="difficulty"
                        class="player-inputs"
                    >
                        <option value="2" selected>Impossible</option>
                        <option value="1">Easy</option>
                    </select>
                    <button class="start-button" type="button">
                        Start Game
                    </button>
                </div>

                <div class="game-start-board bottom hidden">
                    <div class="score-card player">
                        <div id="player-name-1"></div>
                        <div class="score" id="player"></div>
                    </div>
                    <div class="game-board">
                        <button
                            class="cell"
                            type="button"
                            aria-label="Cell 1, empty"
                        ></button>
                        <button
                            class="cell"
                            type="button"
                            aria-label="Cell 2, empty"
                        ></button>
                        <button
                            class="cell"
                            type="button"
                            aria-label="Cell 3, empty"
                        ></button>
                        <button
                            class="cell"
                            type="button"
                            aria-label="Cell 4, empty"
                        ></button>
                        <button
                            class="cell"
                            type="button"
                            aria-label="Cell 5, empty"
                        ></button>
                        <button
                            class="cell"
                            type="button"
                            aria-label="Cell 6, empty"
                        ></button>
                        <button
                            class="cell"
                            type="button"
                            aria-label="Cell 7, empty"
                        ></button>
                        <button
                            class="cell"
                            type="button"
                            aria-label="Cell 8, empty"
                        ></button>
                        <button
                            class="cell"
                            type="button"
                            aria-label="Cell 9, empty"
                        ></button>
                    </div>
                    <div class="score-card computer">
                        <div id="player-name-2"></div>
                        <div class="score" id="computer"></div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
